# Drains 3-hour booking reminders on Azure App Service.
# Must run much more often than daily: skip-after-start marks overdue rows sent
# without delivering, so a once-daily job blacks out daytime bookings.
# Needs repo secret EASYLIFE_CRON_SECRET (= CRON_SECRET on the App Service).

name: Easy Life booking reminders

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes
  workflow_dispatch:

concurrency:
  group: easylife-booking-reminders-cron
  cancel-in-progress: false

jobs:
  run-booking-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/reminders?tasks=reminders
        env:
          CRON_SECRET: ${{ secrets.EASYLIFE_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "EASYLIFE_CRON_SECRET is not set in repo secrets" >&2
            exit 1
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://easylife-plaza-app.azurewebsites.net/api/cron/reminders?tasks=reminders")
          echo "HTTP $status"
          cat response.json
          if [ "$status" != "200" ]; then
            exit 1
          fi
